[project]
name = "apud-bench"
version = "0.0.1"
description = "Benchmark of vision-language models on historical manuscripts: transcription, grounding and citation faithfulness"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "cadeos" }]
dependencies = [
    "httpx>=0.27",
    "pillow>=10",
    "pyyaml>=6",
]

[project.scripts]
apud-bench = "apud_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apud_bench"]

[tool.hatch.build.targets.wheel.force-include]
"subsets/subsets.yaml" = "apud_bench/subsets.yaml"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["apud_bench"]
