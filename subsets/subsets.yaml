# Benchmark subsets, v0 draft (2026-10-26)
#
# Tiers
#   core          permissive or share-alike open licences: CC-BY, CC0, Apache-2.0, MIT,
#                 Etalab OL 2.0, CC-BY-SA (flagged share-alike)
#   nc-extension  any NonCommercial licence, distributed as a separate subset
#   hold          eligible on paper but licence or access still to confirm
#
# Licence rule: when the HTR-United catalog and the source (Zenodo record / repo LICENSE)
# disagree, the more restrictive one wins. "catalog-only" means the source repo has no
# LICENSE file and the licence comes only from the catalog entry.
#
# Benchmark output for a subset (normalised geometry, splits, manifests) carries that
# subset's licence; data is always fetched from the original source, never redistributed.
#
# Strata: ancient (<500), medieval (500-1499), early-modern (1500-1799), late (>=1800), mixed.
# Tasks:  T = transcription, G = grounding. G-only where the text follows an edition.
# fetch:  optional download hints, e.g. which files of a Zenodo record to take.
# build:  optional build hints, e.g. xml_glob when a source ships several transcription layers
#         (HTRomance: original *.xml and CATMuS-normalised *.chocomufin.xml per page).

